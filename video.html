<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Estrella de la Muerte</title>
    <meta name="description" content="Estrella de la Muerte - a-videosphere">
    <script src="https://aframe.io/releases/1.8.0/aframe.min.js"></script>
    <script>
      // boton play/pausa, a veces el navegador no deja que el video arranque solo
      AFRAME.registerComponent('control-video', {
        init: function () {
          var video = document.getElementById('estacion');
          var texto = document.getElementById('textoBoton');

          function cambiarTexto() {
            if (video.paused) {
              texto.setAttribute('value', 'PLAY');
            } else {
              texto.setAttribute('value', 'PAUSA');
            }
          }

          this.el.addEventListener('click', function () {
            if (video.paused) {
              video.play();
            } else {
              video.pause();
            }
          });
          video.addEventListener('play', cambiarTexto);
          video.addEventListener('pause', cambiarTexto);
          cambiarTexto();
        }
      });
    </script>
  </head>
  <body>
    <a-scene>
      <a-assets>
        <img id="texturaChapa" src="assets/alax.png">
        <img id="texturaTIE" src="assets/tie.png">
        <video id="estacion" src="assets/deathstar360.mp4" autoplay loop="true" muted playsinline></video>
      </a-assets>

      <a-videosphere src="#estacion" rotation="0 -90 0"></a-videosphere>

      <!-- titulo -->
      <a-entity position="0 2.3 -4">
        <a-plane width="4" height="0.7" color="#000000" opacity="0.7"></a-plane>
        <a-plane position="0 -0.37 0.005" width="4" height="0.04" material="shader: flat; color: #ff2b2b"></a-plane>
        <a-text value="ESTRELLA DE LA MUERTE" font="exo2bold" color="#ff3b30" align="center" position="0 0 0.01" scale="1.3 1.3 1.3"></a-text>
      </a-entity>

      <a-entity position="1.3 0.7 -2.8" scale="0.8 0.8 0.8">
        <a-circle class="clicable" control-video radius="0.35" color="#8b0000"
                  animation__enter="property: scale; startEvents: mouseenter; dur: 200; to: 1.2 1.2 1.2"
                  animation__leave="property: scale; startEvents: mouseleave; dur: 200; to: 1 1 1"></a-circle>
        <a-ring radius-inner="0.35" radius-outer="0.4" position="0 0 0.005" material="shader: flat; color: #ff3b30"></a-ring>
        <a-text id="textoBoton" value="PLAY" color="#ffffff" align="center" position="0 0 0.01" scale="0.8 0.8 0.8"></a-text>
      </a-entity>

      <!-- luces rojas -->
      <a-sphere position="-4 3 -1" radius="0.15" material="shader: flat; color: #ff0000; transparent: true"
                animation="property: material.opacity; from: 1; to: 0.15; dir: alternate; dur: 600; loop: true"></a-sphere>
      <a-sphere position="4 3 -1" radius="0.15" material="shader: flat; color: #ff0000; transparent: true"
                animation="property: material.opacity; from: 0.15; to: 1; dir: alternate; dur: 600; loop: true"></a-sphere>

      <!-- caza TIE delante de la camara, mirando hacia donde avanza el video
           para que parezca que vamos detras de el -->
      <a-entity position="-0.5 0.75 -2.6" scale="0.85 0.85 0.85"
                animation__subir="property: position; dir: alternate; dur: 2600; loop: true; easing: easeInOutSine; to: -0.35 0.85 -2.6"
                animation__inclinar="property: rotation; dir: alternate; dur: 3400; loop: true; easing: easeInOutSine; from: 0 0 -6; to: 0 0 6">
        <a-sphere radius="0.35" src="#texturaChapa" color="#7d848f" metalness="0.5"></a-sphere>
        <a-circle position="0 0 -0.345" radius="0.16" material="shader: flat; color: #101418"></a-circle>
        <a-circle position="0 0 0.345" radius="0.14" color="#3a3f47"></a-circle>
        <a-ring position="0 0 0.35" radius-inner="0.12" radius-outer="0.15" color="#9aa1ab"></a-ring>
        <a-cylinder rotation="0 0 90" radius="0.06" height="1.5" src="#texturaChapa" color="#7d848f"></a-cylinder>
        <!-- alas (cilindros de 6 lados) -->
        <a-cylinder position="0.75 0 0" rotation="0 0 90" radius="0.9" height="0.04" segments-radial="6" src="#texturaTIE"></a-cylinder>
        <a-cylinder position="-0.75 0 0" rotation="0 0 90" radius="0.9" height="0.04" segments-radial="6" src="#texturaTIE"></a-cylinder>
      </a-entity>

      <a-camera>
        <a-cursor color="#ff3b30" raycaster="objects: .clicable"></a-cursor>
      </a-camera>
    </a-scene>
  </body>
</html>
